<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriChef</title>

    <!-- en esta parte comenzamos los que seria el css pero en este caso es tailwind-->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-50">
    <!--encabezado-->
    <header class="flex justify-between items-center p-4 bg-green-100">
      <!--logo-->
      <div class="logo flex items-center gap-3">
        <img
          src="img/logo.jpg"
          alt=" Logo de NutriChef"
          class="w-16 h-16 rounded-full"
        />
        <h1 class="text-2xl font-bold text-green-700">NutriChef</h1>
      </div>

      <!--buscador-->
      <div class="buscador flex-1 mx-8 flex gap-2">
        <input
          type="text"
          id="buscador"
          placeholder=" 🔍 Buscar recetas saludables ..."
          class="w-full border rounded-xl p-2"
        />

        <button
          id="btnBuscar"
          class="bg-green-600 text-white px-4 rounded-xl hover:bg-green-700"
        >
          Buscar
        </button>
      </div>

      <!--menu de navegación-->
      <nav>
        <ul class="flex gap-4">
          <li>
            <a href="#" id="menuInicio">🏡 Inicio</a>
          </li>
          <li>
            <a href="#" id="menuPollo">🍗 Pollo</a>
          </li>
          <li>
            <a href="#" id="menuRes">🥩 Res</a>
          </li>
          <li>
            <a href="#" id="menuCerdo">🐖 Cerdo</a>
          </li>
          <li>
            <a href="#" id="menuVegetal">🥦 Vegetal</a>
          </li>
          <li>
            <a href="#" id="menuMasBuscadas">⭐ Más buscadas</a>
          </li>
        </ul>
      </nav>

      <!--modo oscuro-->
      <button id="modoOscuro" class="text-2xl">🌙</button>
    </header>

    <main>
      <!-- estrucutra de las tarjetas de recetas -->
      <!-- comienza vacia  -->
      <div
        id="contenedor-de-recetas"
        class="flex flex-wrap justify-center gap-8 p-8"
      ></div>
    </main>

    <!-- Modal -->
    <div
      id="modal"
      class="hidden fixed inset-0 bg-black/50 flex items-center justify-center"
    >
      <div class="bg-white rounded-xl p-6 max-w-2xl w-full">
        <button id="cerrarModal">✖</button>

        <img id="imagenModal" src="" alt="Imagen receta" />

        <h2 id="tituloModal"></h2>
        <h3 class="font-bold mt-4">Ingredientes</h3>
        <p id="ingredientesModal"></p>
        <h3 class="font-bold mt-4">Preparación</h3>
        <p id="preparacionModal"></p>
      </div>
    </div>

    <!--footer-->
    <footer class="bg-green-100 text-center p-6">
      <p>© 2026 NutriChef</p>

      <p>Descubre recetas saludables para cada ocasión.</p>
    </footer>

    <!-- cinectamos con JS -->
    <script src="logica.js"></script>
  </body>
</html>
